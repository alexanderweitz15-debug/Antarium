<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formicarium – Insekten-Oekosystem</title>
<!-- Eingebettetes Symbol: spart eine 404-Anfrage nach favicon.ico. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0d0c'/%3E%3Cg fill='%23d9483b'%3E%3Ccircle cx='8' cy='3.6' r='2'/%3E%3Ccircle cx='8' cy='7.4' r='1.7'/%3E%3Cellipse cx='8' cy='11.8' rx='2.6' ry='3'/%3E%3C/g%3E%3Cg stroke='%23d9483b' stroke-width='1' stroke-linecap='round'%3E%3Cpath d='M6.4 6.6 3 4.8M9.6 6.6 13 4.8M6.4 8 3 8.4M9.6 8 13 8.4M6.6 9.2 3.4 11.6M9.4 9.2 12.6 11.6M7.2 2.2 5.8 0.6M8.8 2.2 10.2 0.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!--
  PixiJS wird als ES-Modul von einer fest gepinnten CDN-Version geladen.
  js/render/pixi.js faengt einen Fehlschlag ab und benutzt dann die
  mitgelieferte Datei vendor/pixi.min.mjs derselben Version.
-->
<script type="importmap">
{
  "imports": {
    "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.mjs"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>

<div id="ui">
  <header id="topbar" class="bar">
    <div id="breadcrumb" class="crumb">Oberflaeche</div>
    <div id="clock" class="crumb clock" title="Tageszeit"></div>
    <nav id="levelnav" class="levelnav"></nav>
    <div class="grow"></div>
    <div id="speed" class="group" role="group" aria-label="Geschwindigkeit"></div>
    <button id="btn-step" class="btn" title="Einzelschritt (nur bei Pause) – Taste .">&#9655;|</button>
    <div class="group" id="phero-group" title="Pheromon-Overlay (nur Oberflaeche)">
      <button class="btn toggle" data-phero="0" title="Heimweg-Spuren">Heim</button>
      <button class="btn toggle" data-phero="1" title="Nahrungsspuren (Taste P)">Futter</button>
      <button class="btn toggle" data-phero="2" title="Alarmspuren">Alarm</button>
    </div>
    <div class="group">
      <button id="btn-pip" class="btn toggle" title="Bild-in-Bild: andere Ebene beobachten (Taste B)">PiP</button>
      <button id="btn-cinema" class="btn toggle" title="Kinomodus: springt zu Ereignissen (Taste C)">Kino</button>
      <button id="btn-autojump" class="btn toggle" title="Bei Angriff automatisch zur bedrohten Ebene wechseln">Auto</button>
      <button id="btn-front" class="btn toggle" title="Kamera folgt dem Schwerpunkt der Kaempfe (Taste K)">Front</button>
      <button id="btn-research" class="btn toggle" title="Forschungsmenue: Evolution im Zeitraffer (Taste R)">Forsch.</button>
      <button id="btn-stats" class="btn toggle" title="Stammbaum und Statistik (Taste T)">Stamm.</button>
      <button id="btn-settings" class="btn toggle" title="Einstellungen und Spielstaende (Taste O)">Einst.</button>
      <button id="btn-grid" class="btn toggle" title="Chunk-Raster einblenden (Taste G)">Raster</button>
      <button id="btn-trans" class="btn toggle on" title="Ebenenuebergang animieren">Blende</button>
      <button id="btn-legend" class="btn toggle on" title="Legende (Taste L)">Leg.</button>
      <button id="btn-help" class="btn toggle" title="Tastenkuerzel (Taste H)">?</button>
    </div>
    <div class="group world-group">
      <select id="mapselect" class="sel" title="Kartenvorlage"></select>
      <input id="seedinput" class="inp" size="9" title="Seed der Welt" spellcheck="false">
      <button id="btn-dice" class="btn" title="Zufaelligen Seed wuerfeln">⚄</button>
      <button id="btn-newworld" class="btn" title="Welt mit diesen Einstellungen neu erzeugen">Neu</button>
    </div>
    <div id="seedbox" class="seed" title="Version"></div>
  </header>

  <aside id="left">
    <section id="panel-tools" class="panel">
      <h2>Werkzeuge <span id="tool-level" class="tiny"></span></h2>
      <div id="tools" class="panel-body scroll"></div>
    </section>
  </aside>

  <aside id="right">
    <section id="panel-colonies" class="panel">
      <h2>Kolonien</h2>
      <div id="colonies" class="panel-body"></div>
    </section>
    <section id="panel-legend" class="panel">
      <h2>Legende
        <label class="tiny"><input type="checkbox" id="legend-visible-only"> nur Sichtbares</label>
      </h2>
      <div id="legend" class="panel-body scroll"></div>
    </section>
  </aside>

  <section id="panel-log" class="panel">
    <h2>Ereignisse <span id="log-filters" class="filters"></span></h2>
    <div id="log" class="panel-body scroll"></div>
  </section>

  <section id="panel-research" class="panel" hidden>
    <h2>Forschung <span class="tiny">Sandbox</span>
      <button id="research-close" class="btn tiny">x</button></h2>
    <div id="research" class="panel-body scroll"></div>
  </section>

  <section id="panel-settings" class="panel" hidden>
    <h2>Einstellungen
      <button id="settings-close" class="btn tiny">x</button></h2>
    <div id="settings" class="panel-body scroll"></div>
  </section>

  <section id="panel-stats" class="panel" hidden>
    <h2>Stammbaum und Statistik
      <button id="stats-close" class="btn tiny">x</button></h2>
    <div id="stats" class="panel-body scroll"></div>
  </section>

  <div id="ff-overlay" class="overlay" hidden></div>

  <div id="inspector" class="panel" hidden>
    <h2>Inspektor <button id="insp-close" class="btn tiny">x</button></h2>
    <div id="inspector-body" class="panel-body"></div>
  </div>

  <section id="panel-minimap" class="panel">
    <h2>Karte <span id="minimap-label" class="tiny"></span></h2>
    <canvas id="minimap" width="168" height="168"></canvas>
  </section>

  <div id="pips"></div>
  <div id="toasts"></div>

  <div id="perf" class="overlay" hidden></div>
  <div id="help" class="overlay help" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <div id="debugmenu" class="panel" hidden>
    <h2>Debug</h2>
    <div class="panel-body">
      <button class="btn" data-debug="ants5000">5000 Ameisen spawnen</button>
      <button class="btn" data-debug="colonies8">8 Kolonien gruenden</button>
      <button class="btn" data-debug="ants1000">+1000 Ameisen</button>
      <button class="btn" data-debug="clear">Ameisen entfernen</button>
      <button class="btn" data-debug="dirty">Alle Chunks neu zeichnen</button>
    </div>
  </div>
</div>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-title">Formicarium</div>
    <div id="boot-msg">Lade PixiJS und erzeuge die Welt …</div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
